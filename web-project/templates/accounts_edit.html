{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <h1>Edit Chart Account</h1>
    <p>Update an account while keeping accounting code rules consistent.</p>
  </div>
  <a href="/accounts" class="btn btn-secondary">Back</a>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="form-card">
  <form method="POST" action="/accounts/{{ account.id }}/edit" class="stacked-form">
    <div class="form-group">
      <label>Code</label>
      <input type="text" name="code" value="{{ account.code }}" pattern="[1-5][0-9]{3}" title="Use 1000-5999 account code ranges" required>
      <small>1xxx Asset, 2xxx Liability, 3xxx Equity, 4xxx Revenue, 5xxx Expense.</small>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" value="{{ account.name }}" required>
    </div>

    <div class="form-group">
      <label>Account Type</label>
      <select name="account_type" required>
        <option value="Asset" {% if account.account_type == "Asset" %}selected{% endif %}>Asset</option>
        <option value="Liability" {% if account.account_type == "Liability" %}selected{% endif %}>Liability</option>
        <option value="Equity" {% if account.account_type == "Equity" %}selected{% endif %}>Equity</option>
        <option value="Revenue" {% if account.account_type == "Revenue" %}selected{% endif %}>Revenue</option>
        <option value="Expense" {% if account.account_type == "Expense" %}selected{% endif %}>Expense</option>
      </select>
    </div>

    <div class="form-group">
      <label>Normal Balance</label>
      <select name="normal_balance" required>
        <option value="Debit" {% if account.normal_balance == "Debit" %}selected{% endif %}>Debit</option>
        <option value="Credit" {% if account.normal_balance == "Credit" %}selected{% endif %}>Credit</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/accounts" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
