{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <h1>New Journal Entry</h1>
    <p>Create a balanced debit and credit journal entry.</p>
  </div>
  <a href="/journal" class="btn btn-secondary">Back</a>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="form-card">
  <form method="POST" action="/journal" class="stacked-form">
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="entry_date" required>
    </div>

    <div class="form-group">
      <label>Memo</label>
      <input type="text" name="memo" required>
    </div>

    <div class="form-group">
      <label>Debit Account</label>
      <select name="debit_account_id" required>
        {% for account in accounts %}
        <option value="{{ account.id }}">{{ account.code }} {{ account.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Credit Account</label>
      <select name="credit_account_id" required>
        {% for account in accounts %}
        <option value="{{ account.id }}">{{ account.code }} {{ account.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" name="amount" step="0.01" min="0.01" required>
      <small>Example: 25.50 means $25.50.</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Entry</button>
      <a href="/journal" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
