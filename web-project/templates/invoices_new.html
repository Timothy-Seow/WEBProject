{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <h1>New Invoice</h1>
    <p>Create an invoice and post Accounts Receivable and Sales Revenue.</p>
  </div>

  <a href="/invoices" class="btn btn-secondary">Back</a>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="form-card">
  <form method="POST" action="/invoices" class="stacked-form">
    <div class="form-group">
      <label>Customer</label>
      <select name="customer_id" required>
        <option value="" disabled selected>Select a customer</option>
        {% for customer in customers %}
        <option value="{{ customer.id }}">{{ customer.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Invoice Date</label>
      <input type="date" name="invoice_date" required>
    </div>

    <div class="form-group">
      <label>Due Date</label>
      <input type="date" name="due_date" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <input type="text" name="description" required>
    </div>

    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" name="amount" step="0.01" min="0.01" required>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Invoice</button>
      <a href="/invoices" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
