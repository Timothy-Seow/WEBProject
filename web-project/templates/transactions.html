{% extends "base.html" %}
{% block content %}
<main>
    <h1>Transaction History</h1>
    <table class="transaction-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for tx in transactions %}
            <tr>
                <td>{{ tx.id }}</td>
                <td>{{ tx.date }}</td>
                <td>{{ tx.description }}</td>
                <td>{{ tx.amount }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>
{% endblock %}
