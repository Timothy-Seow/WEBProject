<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CareSync</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Form Panel -->
  <div class="login-form-side">
    <div class="login-card">
      <h2>Welcome</h2>
      <p>Sign in to access the banking system portal.</p>

      {% if error %}
      <div class="alert alert-error">⚠ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="form-group" style="margin-bottom:16px">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:24px">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px">
          Sign In →
        </button>
      </form>

      <div style="display:grid;gap:6px;font-size:.83rem;color:var(--text-2)">
        <div>Admin: admin / admin123</div>
        <div>Customer: john / customer123</div>
        <div>(rmb to remove this later)</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
