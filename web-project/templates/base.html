<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGO OR NAME</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">
  
  <header class="app-header">
    <div class="header-logo">LOGO</div>
    <div class="header-spacer"></div>
    {% if logged_in %}
    <div class="header-user">
      <span>{{ session_name }}</span>
      <span class="header-badge">{{ session_role }}</span>
      <a href="/dashboard" class="header-link">Dashboard</a>
      <a href="/transactions" class="header-link">Transactions</a>
      <a href="/logout" class="header-logout">⎋ Logout</a>
    </div>
    {% endif %}
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
