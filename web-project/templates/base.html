<!-- Using this html to create a basic top bar for all pages. not working yet -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGO OR NAME</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">

  <!-- Header -->
  <header class="app-header">
    <div class="header-logo">LOGO<span>HERE</span></div>
    <div class="header-spacer"></div>
    {% if logged_in %}
    <div class="header-user">
      <div class="header-avatar">{{ session_full_name | truncate(length=1, end="") }}</div>
      <span>{{ session_full_name }}</span>
      <span class="header-badge">{{ session_role }}</span>
      <a href="/logout" class="header-logout">⎋ Logout</a>
    </div>
    {% endif %}
  </header>
