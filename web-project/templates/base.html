<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">

  <header>
    <nav class="navbar">
      <div class="logo">
        <span class="logo-icon">💰</span>
        <span class="logo-text">BudgetFlow</span>
      </div>

      <ul class="nav-links">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/accounts">Accounts</a></li>
        <li><a href="/journal">Journal</a></li>
        <li><a href="/ledger">Ledger</a></li>
        <li><a href="/reports/profit-loss">Profit &amp; Loss</a></li>
        <li><a href="/reports/balance-sheet">Balance Sheet</a></li>
        <li><a href="/expenses">Expenses</a></li>
        <li><a href="/customers">Customers</a></li>
        <li><a href="/invoices">Invoices</a></li>
        {% if is_admin %}
        <li><a href="/audit">Audit Trail</a></li>
        {% endif %}
      </ul>

      <div class="nav-right">
        <span class="customer-tag">{{session_role}}</span>
        <div class="user-info">
          <span class="user-name">{{session_name}}</span>
          <span class="user-icon">👤</span>
        </div>
        <a href="/logout" class="logout-btn">Logout</a>
      </div>
    </nav>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
