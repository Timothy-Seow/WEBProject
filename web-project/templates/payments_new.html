{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div><h1>Receive Payment</h1><p>Settle an unpaid customer invoice.</p></div>
  <a href="/invoices" class="btn btn-secondary">Back</a>
</div>

{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<div class="form-card">
  <form method="POST" action="/payments" class="stacked-form">
    <div class="form-group">
      <label>Unpaid Invoice</label>
      <select name="invoice_id" required>
        {% for invoice in invoices %}
        <option value="{{ invoice.id }}">
          {{ invoice.invoice_no }} - {{ invoice.customer_name }} - Balance {{ invoice.remaining_display }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Payment Amount</label>
      <input type="number" name="amount" min="0.01" step="0.01" required>
    </div>
    <div class="form-group">
      <label>Payment Date</label>
      <input type="date" name="payment_date" required>
    </div>
    <div class="form-group">
      <label>Received Into</label>
      <select name="cash_account_id" required>
        {% for account in cash_accounts %}
        <option value="{{ account.id }}">{{ account.code }} {{ account.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Record Payment</button>
      <a href="/invoices" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
