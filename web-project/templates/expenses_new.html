{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <h1>New Expense</h1>
    <p>Record a business expense and create its balanced journal entry.</p>
  </div>

  <a href="/expenses" class="btn btn-secondary">Back</a>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="form-card">
  <form method="POST" action="/expenses" class="stacked-form">
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="expense_date" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <input type="text" name="description" required>
    </div>

    <div class="form-group">
      <label>Expense Account</label>
      <select name="expense_account_id" required>
        <option value="" disabled selected>Select an expense account</option>
        {% for account in accounts %}
          {% if account.account_type == "Expense" %}
          <option value="{{ account.id }}">
            {{ account.code }} {{ account.name }}
          </option>
          {% endif %}
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Paid From / Owed To</label>
      <select name="payment_account_id" required>
        <option value="" disabled selected>Select a payment account</option>
        {% for account in accounts %}
          {% if account.account_type == "Asset" %}
          <option value="{{ account.id }}">
            {{ account.code }} {{ account.name }}
          </option>
          {% elif account.account_type == "Liability" %}
          <option value="{{ account.id }}">
            {{ account.code }} {{ account.name }}
          </option>
          {% endif %}
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" name="amount" step="0.01" min="0.01" required>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Record Expense</button>
      <a href="/expenses" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
